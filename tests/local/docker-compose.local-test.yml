# Docker Compose for Local System Tests
# Creates a clean PostgreSQL instance for each test run

services:
  postgres:
    image: postgres:16-alpine
    container_name: opentrusty-test-postgres
    environment:
      POSTGRES_USER: opentrusty
      POSTGRES_PASSWORD: opentrusty_test_password
      POSTGRES_DB: opentrusty_test
    ports:
      - "5434:5432"
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U opentrusty -d opentrusty_test" ]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  test_postgres_data:
